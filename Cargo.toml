[package]
name = "position-and-risk-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance Position and Risk Engine MVP for FinTech portfolios"
authors = ["FinTech Engineering Team"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
